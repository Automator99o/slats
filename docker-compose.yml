version: "3.8"

services:
  renderer:
    build: .
    command: ["--port", "5100"]
    volumes:
      - ./output:/app/output           # rendered videos go here
      - ./batch.csv:/app/batch.csv     # hot-swap without rebuild
      - ./tmp:/app/tmp                 # local frames storage during render
      - ./engine.py:/app/engine.py     # hot-swap code changes
      - ./animation.html:/app/animation.html # hot-swap page changes
    shm_size: 1gb                       # required for Chromium
    cap_add:
      - SYS_ADMIN                       # required for Playwright sandbox
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5100:5100"
    restart: "no"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# USAGE EXAMPLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Launch the frontend studio (DEFAULT):
#   docker compose up --build
#
# Bulk batch render from CSV as MOV (opt-in):
#   docker compose run renderer python engine.py --batch-render
#
# Batch render as MP4 instead:
#   docker compose run renderer python engine.py --batch-render --format mp4
#
# Resume batch from clip 10:
#   docker compose run renderer python engine.py --batch-render --start-from 10
#
# Preview first clip in browser before batch rendering:
#   docker compose run renderer python engine.py --batch-render --preview
#
# Rebuild after editing animation.html or engine.py:
#   docker compose build --no-cache
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

